<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRP Ledger — Withdraw (dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
x-dc{display:none!important}

body{margin:0}
*{box-sizing:border-box}
.m{--bg:#FFFFFF;--surface:#FFFFFF;--sunken:#F4F4F4;--border:#E6E6E6;--border-strong:#D4D4D4;--text:#0A0A0A;--text-2:#474747;--text-3:#6B6B6B;--accent:#0A0A0A;--accent-soft:#F0F0F0;--accent-text:#0A0A0A;--on-accent:#FFFFFF;--pos:#15803D;--neg:#C81E1E;--warn:#A16207;--warn-soft:#FEF6E0;--neg-soft:#FDECEC;--dot-warn:#EAB308;position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.m.dark{--bg:#000000;--surface:#0D0D0D;--sunken:#1A1A1A;--border:#242424;--border-strong:#383838;--text:#FFFFFF;--text-2:#BDBDBD;--text-3:#8F8F8F;--accent:#FFFFFF;--accent-soft:#1F1F1F;--accent-text:#FFFFFF;--on-accent:#000000;--pos:#4ADE80;--neg:#EF4444;--warn:#FACC15;--warn-soft:#262006;--neg-soft:#2A0D0D;--dot-warn:#FACC15}
.m button,.m input,.m select{font:inherit;color:inherit}
.m :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 108px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid transparent;white-space:nowrap}
.m .btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.topbar{display:flex;align-items:center;gap:8px;min-height:48px;margin:0 -4px 4px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;text-decoration:none;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:500}
.help{font-size:12.5px;color:var(--text-3);line-height:1.45}
.err{font-size:12.5px;color:var(--neg);line-height:1.45}
.input-wrap{display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface)}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input-wrap.invalid{border-color:var(--neg)}
.input-wrap input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:15px}
.readonly{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--sunken)}
.mini{height:32px;padding:0 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:500;cursor:pointer}
.kv{margin:0;display:flex;flex-direction:column;padding:2px 14px}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-top:1px solid var(--border);font-size:13.5px}
.kv>div:first-child{border-top:0}
.kv dt{color:var(--text-3)}.kv dd{margin:0;text-align:right;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv>div.total{font-size:14.5px}.kv>div.total dt{color:var(--text);font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45}
.banner.info{background:var(--sunken);color:var(--text-2)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.steps{display:flex;gap:6px;margin:4px 0 20px}
.steps span{flex:1;height:3px;border-radius:2px;background:var(--border)}
.steps span.on{background:var(--accent)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:500;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.off{background:var(--sunken);color:var(--text-3)}
.tl{list-style:none;margin:0;padding:14px;display:flex;flex-direction:column}
.tl li{position:relative;display:flex;gap:12px;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:7px;top:18px;bottom:-2px;width:2px;background:var(--border)}
.tl li:last-child{padding-bottom:0}.tl li:last-child::before{display:none}
.tl .dot{position:relative;width:16px;height:16px;margin-top:1px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);flex:none}
.tl li.done .dot{border-color:var(--accent);background:var(--accent)}
.tl li.done::before{background:var(--accent)}
.tl li.now .dot{border-color:var(--dot-warn);box-shadow:0 0 0 4px var(--warn-soft)}
.tl li.skip{opacity:.5}
.footer{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 16px 28px;background:var(--bg);border-top:1px solid var(--border)}
.footer .btn{flex:1}
.otp{width:100%;height:60px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface);text-align:center;font-size:26px;letter-spacing:.4em;outline:0}
.otp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

</style>
</head>
<body>
<div class="sc-host"><div class="m dark">
  <div class="scroll">
    <div class="topbar">
      
      
        <a class="icon-btn" href="07-Home-dark.html" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      
      <h1 style="flex: 1 1 0%; margin: 0px; font-size: 17px; font-weight: 600; text-align: center;"><span class="sc-interp">Withdraw XRP</span></h1>
      <span style="width: 44px;"></span>
    </div>
    
      <div class="steps" aria-label="Step 1 of 4"><span class="on"></span><span class=""></span><span class=""></span><span class=""></span></div>
    

    
    
      <div style="display: flex; flex-direction: column; gap: 18px;">
        <div class="field">
          <span class="label">Asset and network</span>
          <div class="readonly">
            <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600;">X</span>
            <span style="flex: 1 1 0%; font-weight: 500;">XRP on XRP Ledger</span>
            <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3);"><rect x="5" y="10.5" width="14" height="10" rx="2"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg>
          </div>
          <span class="help">Other networks aren’t supported for withdrawals yet.</span>
        </div>
        <div class="field">
          <label class="label" for="w-addr">Destination address</label>
          <div class="input-wrap "><input id="w-addr" class="mono" placeholder="r…" value="" autocomplete="off" spellcheck="false" style="font-size: 14px;"><button type="button" class="mini">Paste</button></div>
          
        </div>
        <div class="field">
          <label class="label" for="w-tag">Destination tag</label>
          <div class="input-wrap "><input id="w-tag" class="mono" placeholder="Required by most exchanges" value="" inputmode="numeric" autocomplete="off"></div>
          
          <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); cursor: pointer; margin-top: 2px;">
            <input type="checkbox" style="width: 18px; height: 18px; margin: 0px; accent-color: var(--accent);">
            The recipient doesn’t use a destination tag
          </label>
        </div>
        <div class="banner info">
          <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 1px;"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8h.01"></path></svg>
          <span>New XRP Ledger accounts need a minimum reserve before they can receive. Sending less to an unactivated address will fail.</span>
        </div>
      </div>
    

    
    

    
    

    
    

    
    
  </div>

  <div class="footer">
    
    
      <button type="button" class="btn btn-primary"><span class="sc-interp">Continue</span></button>
    
  </div></div></div>
</body>
</html>
