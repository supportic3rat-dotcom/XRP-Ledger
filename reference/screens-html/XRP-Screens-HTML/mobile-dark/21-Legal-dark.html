<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRP Ledger — Legal (dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
x-dc{display:none!important}

body{margin:0}
*{box-sizing:border-box}
.m{--bg:#FFFFFF;--surface:#FFFFFF;--sunken:#F4F4F4;--border:#E6E6E6;--border-strong:#D4D4D4;--text:#0A0A0A;--text-2:#474747;--text-3:#6B6B6B;--accent:#0A0A0A;--accent-soft:#F0F0F0;--accent-text:#0A0A0A;--on-accent:#FFFFFF;--pos:#15803D;--neg:#C81E1E;--warn:#A16207;--warn-soft:#FEF6E0;--neg-soft:#FDECEC;--dot-warn:#EAB308;position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.m.dark{--bg:#000000;--surface:#0D0D0D;--sunken:#1A1A1A;--border:#242424;--border-strong:#383838;--text:#FFFFFF;--text-2:#BDBDBD;--text-3:#8F8F8F;--accent:#FFFFFF;--accent-soft:#1F1F1F;--accent-text:#FFFFFF;--on-accent:#000000;--pos:#4ADE80;--neg:#EF4444;--warn:#FACC15;--warn-soft:#262006;--neg-soft:#2A0D0D;--dot-warn:#FACC15}
.m button,.m input{font:inherit;color:inherit}
.m :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 32px}
.scroll.pad{padding-bottom:108px}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid transparent;white-space:nowrap}
.m .btn-primary{background:var(--accent);color:var(--on-accent)}
.topbar{display:flex;align-items:center;gap:8px;min-height:48px;margin:0 -4px 8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;text-decoration:none;flex:none}
.sec{margin:20px 4px 8px;font-size:13px;font-weight:600;color:var(--text-2)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:0;border-top:1px solid var(--border);background:transparent;text-align:left;color:var(--text);cursor:pointer}
.row:first-child{border-top:0}
.chev{color:var(--text-3)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.ok{color:var(--pos)}.status.wait{color:var(--warn)}.status.wait::before{background:var(--dot-warn)}.status.off{color:var(--text-3)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45}
.banner.info{background:var(--sunken);color:var(--text-2)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.kv{margin:0;display:flex;flex-direction:column;padding:2px 14px}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-top:1px solid var(--border);font-size:13.5px}
.kv>div:first-child{border-top:0}
.kv dt{color:var(--text-3);flex:none}.kv dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.doc h3{margin:18px 0 6px;font-size:15px;font-weight:600}
.doc p{margin:0;font-size:13.5px;line-height:1.6;color:var(--text-2)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.footer{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 28px;background:var(--bg);border-top:1px solid var(--border)}
.err{font-size:12.5px;color:var(--neg)}

</style>
</head>
<body>
<div class="sc-host"><div class="m dark">
  <div class="scroll ">
    <div class="topbar">
      
        <a class="icon-btn" href="18-Profile-dark.html" aria-label="Back to Profile"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      
      
      <h1 style="flex: 1 1 0%; margin: 0px; font-size: 17px; font-weight: 600; text-align: center;"><span class="sc-interp">Legal &amp; disclosures</span></h1>
      <span style="width: 44px;"></span>
    </div>

    
      
        <div class="banner warn" role="status">
          <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 1px;"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.8v5M12 16.2h.01"></path></svg>
          <span>One document has changed and needs your review.</span>
        </div>
      
      
        <div>
          <div class="sec"><span class="sc-interp">Account</span></div>
          <div class="card">
            
              <button type="button" class="row">
                <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 500;"><span class="sc-interp">Terms of Service</span></span><span style="font-size: 12px; color: var(--text-3);"><span class="sc-interp">v0.1 draft</span></span></span>
                <span class="status ok"><span class="sc-interp">Accepted</span></span>
                <svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            
              <button type="button" class="row">
                <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 500;"><span class="sc-interp">Privacy Policy</span></span><span style="font-size: 12px; color: var(--text-3);"><span class="sc-interp">v0.1 draft</span></span></span>
                <span class="status ok"><span class="sc-interp">Accepted</span></span>
                <svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            
              <button type="button" class="row">
                <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 500;"><span class="sc-interp">Digital Asset Risk Disclosure</span></span><span style="font-size: 12px; color: var(--text-3);"><span class="sc-interp">v0.1 draft</span></span></span>
                <span class="status ok"><span class="sc-interp">Accepted</span></span>
                <svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            
          </div>
        </div>
      
        <div>
          <div class="sec"><span class="sc-interp">Custody &amp; payments</span></div>
          <div class="card">
            
              <button type="button" class="row">
                <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 500;"><span class="sc-interp">Custody Agreement</span></span><span style="font-size: 12px; color: var(--text-3);"><span class="sc-interp">v0.1 draft</span></span></span>
                <span class="status ok"><span class="sc-interp">Accepted</span></span>
                <svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            
              <button type="button" class="row">
                <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 500;"><span class="sc-interp">Deposit and Withdrawal Policy</span></span><span style="font-size: 12px; color: var(--text-3);"><span class="sc-interp">v0.1 draft</span></span></span>
                <span class="status ok"><span class="sc-interp">Accepted</span></span>
                <svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            
              <button type="button" class="row">
                <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 500;"><span class="sc-interp">Fees and Charges</span></span><span style="font-size: 12px; color: var(--text-3);"><span class="sc-interp">v0.2 draft</span></span></span>
                <span class="status wait"><span class="sc-interp">Review update</span></span>
                <svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            
          </div>
        </div>
      
        <div>
          <div class="sec"><span class="sc-interp">Products</span></div>
          <div class="card">
            
              <button type="button" class="row">
                <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 500;"><span class="sc-interp">Yield Product Terms</span></span><span style="font-size: 12px; color: var(--text-3);"><span class="sc-interp">v0.1 draft</span></span></span>
                <span class="status ok"><span class="sc-interp">Accepted</span></span>
                <svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            
              <button type="button" class="row">
                <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 500;"><span class="sc-interp">Lending and Collateral Agreement</span></span><span style="font-size: 12px; color: var(--text-3);"><span class="sc-interp">v0.1 draft</span></span></span>
                <span class="status ok"><span class="sc-interp">Accepted</span></span>
                <svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            
              <button type="button" class="row">
                <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 500;"><span class="sc-interp">Complaints and Disputes</span></span><span style="font-size: 12px; color: var(--text-3);"><span class="sc-interp">v0.1 draft</span></span></span>
                <span class="status off"><span class="sc-interp">For reference</span></span>
                <svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            
          </div>
        </div>
      
      <p style="margin: 16px 4px 0px; font-size: 12px; line-height: 1.5; color: var(--text-3);">All documents are drafts. Final wording depends on the operating company, jurisdictions and providers, and needs legal review before launch. No licences or approvals are claimed.</p>
    

    
  </div>
  </div></div>
</body>
</html>
