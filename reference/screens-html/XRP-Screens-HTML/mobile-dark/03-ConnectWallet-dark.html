<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRP Ledger — ConnectWallet (dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
x-dc{display:none!important}

body{margin:0}
*{box-sizing:border-box}
.m{--bg:#FFFFFF;--surface:#FFFFFF;--sunken:#F4F4F4;--border:#E6E6E6;--border-strong:#D4D4D4;--text:#0A0A0A;--text-2:#474747;--text-3:#6B6B6B;--accent:#0A0A0A;--accent-soft:#F0F0F0;--accent-text:#0A0A0A;--on-accent:#FFFFFF;--pos:#15803D;--neg:#C81E1E;--warn:#A16207;--warn-soft:#FEF6E0;--neg-soft:#FDECEC;--dot-warn:#EAB308;position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.m.dark{--bg:#000000;--surface:#0D0D0D;--sunken:#1A1A1A;--border:#242424;--border-strong:#383838;--text:#FFFFFF;--text-2:#BDBDBD;--text-3:#8F8F8F;--accent:#FFFFFF;--accent-soft:#1F1F1F;--accent-text:#FFFFFF;--on-accent:#000000;--pos:#4ADE80;--neg:#EF4444;--warn:#FACC15;--warn-soft:#262006;--neg-soft:#2A0D0D;--dot-warn:#FACC15}
.m button,.m input{font:inherit;color:inherit}
.m :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 32px}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid transparent;white-space:nowrap;width:100%}
.m .btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-sm{height:40px;font-size:13.5px;width:auto;flex:1}
.topbar{display:flex;align-items:center;gap:8px;min-height:48px;margin:0 -4px 8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;text-decoration:none;flex:none}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--sunken)}
.seg-btn{flex:1;height:38px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer}
.seg-btn.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:0;border-top:1px solid var(--border);background:transparent;text-align:left;cursor:pointer;color:var(--text)}
.opt:first-child{border-top:0}
.opt-ic{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--sunken);color:var(--text-2);flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:500}
.help{font-size:12.5px;color:var(--text-3);line-height:1.45}
.err{font-size:12.5px;color:var(--neg);line-height:1.45}
.input-wrap{display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface)}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input-wrap.invalid{border-color:var(--neg)}
.input-wrap input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:14px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45}
.banner.info{background:var(--sunken);color:var(--text-2)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.error{background:var(--neg-soft);color:var(--neg)}
.kv{margin:0;display:flex;flex-direction:column;padding:2px 14px}
.kv>div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--border);font-size:13.5px}
.kv>div:first-child{border-top:0}
.kv dt{color:var(--text-3)}.kv dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.word{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:13px;min-width:0}
.word .n{width:16px;flex:none;font-size:11px;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums}
.word .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.word.empty .w{color:var(--text-3)}
.tick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

</style>
</head>
<body>
<div class="sc-host"><div class="m dark">
  <div class="scroll">
    <div class="topbar">
      <a class="icon-btn" href="01-Welcome-dark.html" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <span style="flex: 1 1 0%; font-size: 13px; color: var(--text-3); text-align: center; margin-right: 44px;">Optional</span>
    </div>

    
      <h1 style="margin: 0px 0px 6px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em;">Connect a wallet you already own</h1>
      <p style="margin: 0px 0px 16px; font-size: 14px; line-height: 1.5; color: var(--text-2);">Link it to see its balance, or import it with its recovery phrase to use it from this app. It stays separate from your custodial account.</p>

      <div class="seg" role="group" aria-label="Connection method" style="margin-bottom: 16px;">
        <button type="button" class="seg-btn on" aria-pressed="true">Wallet app</button>
        <button type="button" class="seg-btn " aria-pressed="false">Address</button>
        <button type="button" class="seg-btn " aria-pressed="false">Recovery phrase</button>
      </div>

      
      
        <div class="card">
          <button type="button" class="opt">
            <span class="opt-ic" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><rect x="7" y="3.5" width="10" height="17" rx="2"></rect><path d="M11 17.5h2"></path></svg></span>
            <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 1px;"><span style="font-weight: 500;">XRPL wallet on this phone</span><span class="help">Opens the app to approve</span></span>
            <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3);"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
          <button type="button" class="opt">
            <span class="opt-ic" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><path d="M14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 18v2"></path></svg></span>
            <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 1px;"><span style="font-weight: 500;">Wallet on another device</span><span class="help">Scan a QR code to approve</span></span>
            <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3);"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
          <button type="button" class="opt">
            <span class="opt-ic" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="3.5" width="12" height="17" rx="3"></rect><path d="M10 8h4M12 13.5v3"></path></svg></span>
            <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 1px;"><span style="font-weight: 500;">Hardware wallet</span><span class="help">Through its companion app</span></span>
            <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3);"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </div>
        <p class="help" style="margin: 10px 4px 0px;">Only your public address is shared. Supported wallets are listed after compatibility testing.</p>
      

      
      

      
      
    

    

    
  </div></div></div>
</body>
</html>
