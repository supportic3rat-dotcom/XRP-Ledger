<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRP Ledger — IdentityCapture (light)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
x-dc{display:none!important}

body{margin:0}
*{box-sizing:border-box}
.m{--bg:#FFFFFF;--surface:#FFFFFF;--sunken:#F4F4F4;--border:#E6E6E6;--border-strong:#D4D4D4;--text:#0A0A0A;--text-2:#474747;--text-3:#6B6B6B;--accent:#0A0A0A;--accent-soft:#F0F0F0;--accent-text:#0A0A0A;--on-accent:#FFFFFF;--pos:#15803D;--neg:#C81E1E;--warn:#A16207;--warn-soft:#FEF6E0;--neg-soft:#FDECEC;--dot-warn:#EAB308;position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.m.dark{--bg:#000000;--surface:#0D0D0D;--sunken:#1A1A1A;--border:#242424;--border-strong:#383838;--text:#FFFFFF;--text-2:#BDBDBD;--text-3:#8F8F8F;--accent:#FFFFFF;--accent-soft:#1F1F1F;--accent-text:#FFFFFF;--on-accent:#000000;--pos:#4ADE80;--neg:#EF4444;--warn:#FACC15;--warn-soft:#262006;--neg-soft:#2A0D0D;--dot-warn:#FACC15}
.m button,.m input,.m select{font:inherit;color:inherit}
.m :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 108px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid transparent;white-space:nowrap}
.m .btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.topbar{display:flex;align-items:center;gap:8px;min-height:48px;margin:0 -4px 4px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;text-decoration:none;flex:none}
.h1{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.lead{margin:0 0 18px;font-size:14px;line-height:1.5;color:var(--text-2)}
.steps{display:flex;gap:6px;margin:4px 0 20px}
.steps span{flex:1;height:3px;border-radius:2px;background:var(--border)}
.steps span.on{background:var(--accent)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:0;border-top:1px solid var(--border);background:transparent;text-align:left;cursor:pointer;color:var(--text)}
.opt:first-child{border-top:0}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);flex:none}
.radio.on{border:6px solid var(--accent)}
.label{font-size:13px;font-weight:500}
.help{font-size:12.5px;color:var(--text-3);line-height:1.45}
.err{font-size:12.5px;color:var(--neg);line-height:1.45}
.input-wrap{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 14px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface)}
.input-wrap select{flex:1;min-width:0;height:50px;border:0;outline:0;background:transparent;font-size:15px;appearance:none}
.frame{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:var(--sunken);color:var(--text-3);font-size:13px;overflow:hidden}
.frame .c{position:absolute;width:26px;height:26px;border-color:var(--text);border-style:solid;border-width:0}
.frame .tl{top:14px;left:14px;border-top-width:3px;border-left-width:3px;border-top-left-radius:8px}
.frame .tr{top:14px;right:14px;border-top-width:3px;border-right-width:3px;border-top-right-radius:8px}
.frame .bl{bottom:14px;left:14px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:8px}
.frame .br{bottom:14px;right:14px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:8px}
.frame.done{background:var(--accent-soft);color:var(--text)}
.oval{width:190px;height:240px;border-radius:50%;border:3px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--text-3);font-size:13px}
.oval.done{border-style:solid;border-color:var(--pos);color:var(--text)}
.tick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.kv{margin:0;display:flex;flex-direction:column;padding:2px 14px}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-top:1px solid var(--border);font-size:13.5px}
.kv>div:first-child{border-top:0}
.kv dt{color:var(--text-3)}.kv dd{margin:0;text-align:right;font-weight:500}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45}
.banner.info{background:var(--sunken);color:var(--text-2)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--border-strong);border-radius:12px}
.footer{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 16px 28px;background:var(--bg);border-top:1px solid var(--border)}
.footer .btn{flex:1}
.link{color:var(--accent-text)}

</style>
</head>
<body>
<div class="sc-host"><div class="m ">
  <div class="scroll">
    <div class="topbar">
      
      
        <a class="icon-btn" href="05-Verify-light.html" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      
      <span style="flex: 1 1 0%; font-size: 13px; color: var(--text-3); text-align: center; margin-right: 44px;"><span class="sc-interp">Step 1 of 6 · Identity</span></span>
    </div>
    
      <div class="steps" aria-hidden="true">
        <span class="on"></span><span class=""></span><span class=""></span><span class=""></span><span class=""></span><span class=""></span>
      </div>
    

    
      <h1 class="h1">Choose your ID</h1>
      <p class="lead">Use a valid, unexpired government-issued photo ID.</p>
      <div class="card" role="radiogroup" aria-label="Document type">
        
          <button type="button" class="opt" role="radio" aria-checked="false">
            <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 1px;"><span style="font-weight: 500;"><span class="sc-interp">Passport</span></span><span class="help"><span class="sc-interp">Photo page only</span></span></span>
            <span class="radio " aria-hidden="true"></span>
          </button>
        
          <button type="button" class="opt" role="radio" aria-checked="true">
            <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 1px;"><span style="font-weight: 500;"><span class="sc-interp">National ID card</span></span><span class="help"><span class="sc-interp">Front and back</span></span></span>
            <span class="radio on" aria-hidden="true"></span>
          </button>
        
          <button type="button" class="opt" role="radio" aria-checked="false">
            <span style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 1px;"><span style="font-weight: 500;"><span class="sc-interp">Driver’s licence</span></span><span class="help"><span class="sc-interp">Front and back</span></span></span>
            <span class="radio " aria-hidden="true"></span>
          </button>
        
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 18px;">
        <label class="label" for="ic-country">Issuing country</label>
        <div class="input-wrap">
          <select id="ic-country">
            <option value="NG">Nigeria</option><option value="GH">Ghana</option><option value="GB">United Kingdom</option><option value="OTHER">Other</option>
          </select>
          <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3);"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>
      <div class="banner info" style="margin-top: 18px;">
        <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 1px;"><path d="M12 3.5l7 2.6v5.4c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6.1z"></path></svg>
        <span>Photos go straight to [KYC provider] over an encrypted connection. They aren’t saved to your camera roll.</span>
      </div>
    

    

    

    

    

    
  </div>

  <div class="footer">
    
    
    
      <button type="button" class="btn btn-primary"><span class="sc-interp">Continue</span></button>
    
    
  </div></div></div>
</body>
</html>
