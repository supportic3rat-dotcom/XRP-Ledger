<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Performance chart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 100%; padding: 8px 68px 0 0; box-sizing: border-box; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #17211D; font-variant-numeric: tabular-nums; background: #FFFFFF">
  <div role="img" aria-label="{{aria}}" style="position: relative; height: {{h}}px">
    <sc-for list="{{ticks}}" as="t" hint-placeholder-count="4">
      <div aria-hidden="true" style="position: absolute; left: 0; right: -4px; top: {{t.top}}%; border-top: 1px solid #EDF0EC"></div>
      <div aria-hidden="true" style="position: absolute; right: -68px; width: 60px; top: {{t.top}}%; transform: translateY(-50%); text-align: right; font-size: 11px; color: #5F6D66; opacity: {{t.opacity}}">{{t.label}}</div>
    </sc-for>

    <svg aria-hidden="true" viewBox="0 0 1000 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible">
      <path d="{{area}}" style="fill: {{accent}}; fill-opacity: 0.06; stroke: none"></path>
      <path d="{{line}}" style="fill: none; stroke: {{accent}}; stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
    </svg>

    <!-- current value: dashed guide, marker and value tag in the axis gutter -->
    <div aria-hidden="true" style="position: absolute; left: 0; right: -4px; top: {{end.top}}%; border-top: 1px dashed {{accent}}; opacity: 0.35"></div>
    <div aria-hidden="true" style="position: absolute; left: 100%; top: {{end.top}}%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 6px rgba(0,0,0,0.12)"></div>
    <div aria-hidden="true" style="position: absolute; right: -68px; top: {{end.top}}%; transform: translateY(-50%); min-width: 60px; padding: 3px 6px; border-radius: 6px; background: {{accent}}; color: #FFFFFF; font-size: 11px; font-weight: 600; text-align: center">{{end.label}}</div>

    <sc-if value="{{hover.on}}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: {{hover.left}}%; border-left: 1px solid #C9D1CB"></div>
      <div aria-hidden="true" style="position: absolute; left: {{hover.left}}%; top: {{hover.top}}%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #FFFFFF; border: 2px solid {{accent}}; box-sizing: border-box"></div>
      <div aria-hidden="true" style="position: absolute; top: 0; left: {{hover.left}}%; transform: translateX({{hover.tx}}); margin: 0 8px; padding: 6px 10px; background: #FFFFFF; border: 1px solid #E2E6E2; border-radius: 8px; box-shadow: 0 4px 12px -4px rgba(23,33,29,0.14); white-space: nowrap; pointer-events: none">
        <div style="font-size: 13px; font-weight: 600">{{hover.value}}</div>
        <div style="font-size: 11.5px; color: #5F6D66">{{hover.tip}}</div>
      </div>
    </sc-if>

    <div aria-hidden="true" onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" style="position: absolute; inset: 0; cursor: crosshair"></div>
  </div>

  <div aria-hidden="true" style="position: relative; height: 28px">
    <sc-for list="{{xlabels}}" as="x" hint-placeholder-count="5">
      <span style="position: absolute; top: 9px; left: {{x.left}}%; transform: translateX({{x.tx}}); font-size: 11px; color: #5F6D66; white-space: nowrap">{{x.text}}</span>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"points":{"editor":null},"height":{"editor":"int","default":220,"min":120,"max":480},"accent":{"editor":"color","default":"#0A0A0A"},"$preview":{"width":760,"height":256}}'>
var DEFAULT_POINTS = (function () {
  var out = [], v = 22363.54, days = ['Sep 19','Sep 26','Oct 3','Oct 10','Oct 17'];
  for (var i = 0; i < 31; i++) {
    v = 22363.54 + (24680.42 - 22363.54) * i / 30 + Math.sin(i * 0.9) * 260 * (i > 0 && i < 30 ? 1 : 0);
    out.push({ v: i === 30 ? 24680.42 : v, axis: days[Math.min(4, Math.floor(i / 7))], tip: 'Day ' + (i + 1) });
  }
  return out;
})();
function nice(x) { var e = Math.pow(10, Math.floor(Math.log10(x))), f = x / e; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * e; }
function money(v, d) { return '$' + v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function full(v) { return v < 10 ? money(v, 4) : money(v, 2); }

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { hi: null }; }
  componentDidUpdate(prev) { if (prev.points !== this.props.points && this.state.hi !== null) this.setState({ hi: null }); }
  renderVals() {
    var self = this;
    var pts = this.props.points && this.props.points.length > 1 ? this.props.points : DEFAULT_POINTS;
    var h = parseInt(this.props.height, 10) || 220;
    var accent = this.props.accent || '#0A0A0A';
    var n = pts.length, vals = pts.map(function (p) { return p.v; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    var range = (mx - mn) || Math.abs(mx) * 0.02 || 1;
    var lo = mn - range * 0.12, hi = mx + range * 0.28;
    function X(i) { return i / (n - 1) * 1000; }
    function Y(v) { return 100 - (v - lo) / (hi - lo) * 100; }
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(2); }).join(' ');
    var area = line + ' L1000 100 L0 100 Z';

    var step = nice((hi - lo) / 4);
    var dec = step >= 1 ? 0 : (step >= 0.1 ? 1 : (step >= 0.01 ? 2 : 3));
    var endTop = Y(vals[n - 1]);
    var ticks = [];
    for (var t = Math.ceil(lo / step) * step; t <= hi; t += step) {
      var top = Y(t);
      if (top < 4 || top > 98) continue;
      ticks.push({ top: top.toFixed(2), label: money(t, dec), opacity: Math.abs(top - endTop) < 9 ? 0 : 1 });
    }
    var last = vals[n - 1];
    var end = { top: endTop.toFixed(2), label: last >= 1000 ? money(last, 0) : full(last) };

    var hover = { on: false };
    if (this.state.hi !== null && this.state.hi < n) {
      var i = this.state.hi, left = i / (n - 1) * 100;
      hover = { on: true, left: left.toFixed(2), top: Y(vals[i]).toFixed(2), value: full(vals[i]), tip: pts[i].tip, tx: left > 70 ? 'calc(-100% - 16px)' : '0' };
    }
    var xi = [0, 0.25, 0.5, 0.75, 1].map(function (f) { return Math.round(f * (n - 1)); });
    var xlabels = xi.map(function (idx, k) { return { left: (idx / (n - 1) * 100).toFixed(2), text: pts[idx].axis, tx: k === 0 ? '0' : (k === 4 ? '-100%' : '-50%') }; });
    var delta = last - vals[0];

    return {
      h: h, accent: accent, line: line, area: area, ticks: ticks, end: end, hover: hover, xlabels: xlabels,
      aria: 'Line chart from ' + pts[0].tip + ' to ' + pts[n - 1].tip + ': ' + full(vals[0]) + ' to ' + full(last) + ', ' + (delta >= 0 ? 'up ' : 'down ') + full(Math.abs(delta)) + '.',
      onMove: function (e) {
        var r = e.currentTarget.getBoundingClientRect();
        var rel = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        var idx = Math.round(rel * (n - 1));
        if (idx !== self.state.hi) self.setState({ hi: idx });
      },
      onLeave: function () { self.setState({ hi: null }); }
    };
  }
}
</script>
</body>
</html>
