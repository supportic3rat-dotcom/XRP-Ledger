<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>XRP Ledger — Notifications (light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.m{--bg:#FFFFFF;--surface:#FFFFFF;--sunken:#F4F4F4;--border:#E6E6E6;--border-strong:#D4D4D4;--text:#0A0A0A;--text-2:#474747;--text-3:#6B6B6B;--accent:#0A0A0A;--accent-soft:#F0F0F0;--accent-text:#0A0A0A;--on-accent:#FFFFFF;--pos:#15803D;--neg:#C81E1E;--warn:#A16207;--warn-soft:#FEF6E0;--neg-soft:#FDECEC;--dot-warn:#EAB308;position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.m.dark{--bg:#000000;--surface:#0D0D0D;--sunken:#1A1A1A;--border:#242424;--border-strong:#383838;--text:#FFFFFF;--text-2:#BDBDBD;--text-3:#8F8F8F;--accent:#FFFFFF;--accent-soft:#1F1F1F;--accent-text:#FFFFFF;--on-accent:#000000;--pos:#4ADE80;--neg:#EF4444;--warn:#FACC15;--warn-soft:#262006;--neg-soft:#2A0D0D;--dot-warn:#FACC15}
.m button{font:inherit;color:inherit}
.m :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 32px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;min-height:48px;margin:0 -4px 8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;text-decoration:none;flex:none}
.link-btn{border:0;background:none;padding:10px 6px;margin-right:-6px;color:var(--accent-text);font-size:13.5px;font-weight:500;cursor:pointer}
.link-btn[disabled]{color:var(--text-3);cursor:default}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--sunken)}
.seg-btn{flex:1;height:36px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer}
.seg-btn.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.sec{margin:20px 4px 8px;font-size:13px;font-weight:600;color:var(--text-2)}
.note{display:flex;align-items:flex-start;gap:12px;padding:14px;border-top:1px solid var(--border);color:var(--text);text-decoration:none}
.note:first-child{border-top:0}
.note-ic{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--sunken);color:var(--text-2);flex:none}
.note-ic.warn{background:var(--warn-soft);color:var(--warn)}
.note-ic.bad{background:var(--neg-soft);color:var(--neg)}
.note-ic.ok{background:var(--sunken);color:var(--pos)}
.unread{width:8px;height:8px;border-radius:50%;background:var(--neg);flex:none;margin-top:6px}
.empty{padding:40px 16px;text-align:center;color:var(--text-3);font-size:13.5px}
</style>
</helmet>
<div class="m {{themeCls}}">
  <div class="scroll">
    <div class="topbar">
      <a class="icon-btn" href="{{L.home}}" aria-label="Back to Home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <h1 style="flex: 1; margin: 0; font-size: 17px; font-weight: 600; text-align: center">Notifications</h1>
      <button type="button" class="link-btn" onClick="{{markAll}}" disabled="{{noUnread}}">Read all</button>
    </div>

    <div class="seg" role="group" aria-label="Filter notifications">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button type="button" class="seg-btn {{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button>
      </sc-for>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div>
        <div class="sec">{{g.label}}</div>
        <div class="card">
          <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
            <a class="note" href="{{n.href}}" onClick="{{n.read}}" aria-label="{{n.aria}}">
              <span class="note-ic {{n.tone}}" aria-hidden="true"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="{{n.icon}}"></path></svg></span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font-weight: {{n.weight}}">{{n.title}}</span>
                <span style="font-size: 13px; color: var(--text-2); line-height: 1.45">{{n.body}}</span>
                <span style="font-size: 12px; color: var(--text-3)">{{n.time}}</span>
              </span>
              <sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}"><span class="unread" aria-hidden="true"></span></sc-if>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div class="empty">Nothing here yet.</div></sc-if>

    <p style="margin: 20px 4px 0; font-size: 12px; line-height: 1.5; color: var(--text-3)">Tap a notification to open the related screen. Notifications never include your full address, balances or codes.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
var VARIANT = 'light';
var SUF = VARIANT === 'light' ? 'Light' : '';
function to(n) { return n + SUF + '.dc.html'; }
function isDark(p) { if (p === true || p === 'true') return true; if (p === false || p === 'false') return false; return VARIANT === 'dark'; }
var I = {
  recv: 'M17 7L7 17M15 17H7V9', shield: 'M12 3.5l7 2.6v5.4c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6.1z',
  coin: 'M12 5v14M5 12h14', alert: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM12 7.8v5M12 16.2h.01',
  doc: 'M7 3.5h7l4 4V20.5H7zM14 3.5v4h4', ex: 'M4 8.5h14l-3.5-3.5M20 15.5H6l3.5 3.5', clock: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM12 7.5V12l3 2'
};
var NOTES = [
  { id: 'n1', type: 'tx', group: 'Today', icon: I.recv, tone: 'warn', title: 'Deposit detected', body: '1,250.00 XRP is waiting for ledger validation. It’s not in your balance yet.', time: '11:42', to: 'Home', unread: true },
  { id: 'n2', type: 'security', group: 'Today', icon: I.shield, tone: '', title: 'New sign-in', body: 'Chrome on macOS · Lagos. Not you? Revoke the session and change your password.', time: '09:14', to: 'Security', unread: true },
  { id: 'n3', type: 'tx', group: 'Earlier', icon: I.clock, tone: '', title: 'Interest due soon', body: 'Your loan LN-PROTO-0007 has $4.93 interest due on Nov 19.', time: 'Oct 18', to: 'LoanManage', unread: false },
  { id: 'n4', type: 'tx', group: 'Earlier', icon: I.ex, tone: 'bad', title: 'Exchange request rejected', body: 'EX-PROTO-0301 was rejected: payout account not yet verified. No XRP was reserved.', time: 'Oct 9', to: 'Home', unread: false },
  { id: 'n5', type: 'tx', group: 'Earlier', icon: I.coin, tone: 'ok', title: 'Yield reward credited', body: '1.89 XRP from XRP Flexible is now in your available balance.', time: 'Oct 3', to: 'Earn', unread: false },
  { id: 'n6', type: 'security', group: 'Earlier', icon: I.alert, tone: 'warn', title: 'Collateral alert settings', body: 'We’ll alert you if your loan’s LTV passes 55%, and again at the 65% margin call.', time: 'Sep 19', to: 'Borrow', unread: false },
  { id: 'n7', type: 'account', group: 'Earlier', icon: I.doc, tone: '', title: 'Terms updated', body: 'Fees and Charges draft v0.2 is available to review.', time: 'Sep 2', to: 'Legal', unread: false }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all', read: {} }; }
  renderVals() {
    var self = this, s = this.state;
    var list = NOTES.filter(function (n) { return s.filter === 'all' || n.type === s.filter || (s.filter === 'security' && n.type === 'account'); });
    var groups = ['Today', 'Earlier'].map(function (g) {
      return {
        label: g,
        items: list.filter(function (n) { return n.group === g; }).map(function (n) {
          var unread = n.unread && !s.read[n.id];
          return {
            icon: n.icon, tone: n.tone, title: n.title, body: n.body, time: n.time, href: to(n.to), unread: unread, weight: unread ? 600 : 500,
            aria: (unread ? 'Unread. ' : '') + n.title + '. ' + n.body,
            read: function () { var r = Object.assign({}, self.state.read); r[n.id] = true; self.setState({ read: r }); }
          };
        })
      };
    }).filter(function (g) { return g.items.length; });
    var unreadCount = NOTES.filter(function (n) { return n.unread && !s.read[n.id]; }).length;
    return {
      themeCls: isDark(this.props.dark) ? 'dark' : '',
      L: { home: to('Home') },
      filters: [['all', 'All'], ['tx', 'Activity'], ['security', 'Security']].map(function (f) { return { label: f[1], on: s.filter === f[0], cls: s.filter === f[0] ? 'on' : '', pick: function () { self.setState({ filter: f[0] }); } }; }),
      groups: groups, empty: groups.length === 0, noUnread: unreadCount === 0,
      markAll: function () { var r = {}; NOTES.forEach(function (n) { r[n.id] = true; }); self.setState({ read: r }); }
    };
  }
}
</script>
</body>
</html>
