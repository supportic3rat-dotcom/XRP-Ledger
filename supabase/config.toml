project_id = "xrp-ledger-wallet"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["xrpledger://", "http://localhost:3001"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 1800
max_frequency = "30s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30
email_sent = 4

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.kyc]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "application/pdf"]

[storage.buckets.statements]
public = false
allowed_mime_types = ["application/pdf"]

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.provider-webhook-custody]
verify_jwt = false
[functions.provider-webhook-kyc]
verify_jwt = false
[functions.provider-webhook-yield]
verify_jwt = false
[functions.provider-webhook-lending]
verify_jwt = false
[functions.provider-webhook-liquidity]
verify_jwt = false
[functions.ticket-create-public]
verify_jwt = false
[functions.price-history]
verify_jwt = false
[functions.recon-run]
verify_jwt = false
[functions.upkeep]
verify_jwt = false
